name: Traffic NOW regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Collector Worker syntax
        run: node --experimental-default-type=module --check traffic-collector/src/index.js
      - name: Run regression tests
        run: node --experimental-default-type=module --test tests/*.test.js
