<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traffic NOW</title>
  <meta name="description" content="대한민국 실시간 교통정보">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">REALTIME TRAFFIC</p>
        <h1>Traffic NOW</h1>
        <p class="subtitle">부산 실시간 교통정보 · 북구 테스트</p>
      </div>
      <div class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">연결 대기</span>
      </div>
    </header>

    <section class="toolbar">
      <button type="button" data-region="busan">부산 북구 테스트</button>
      <button type="button" id="refreshButton">새로고침</button>
    </section>

    <section class="summary-grid">
      <article class="card">
        <span>조회 구간</span>
        <strong id="regionName">-</strong>
      </article>
      <article class="card">
        <span>도로 구간</span>
        <strong id="linkCount">-</strong>
      </article>
      <article class="card">
        <span>평균 속도</span>
        <strong id="avgSpeed">-</strong>
      </article>
      <article class="card">
        <span>기준 시각</span>
        <strong id="updatedAt">-</strong>
      </article>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>느린 구간</h2>
          <p>현재 조회 영역에서 속도가 낮은 도로부터 표시합니다.</p>
        </div>
        <span id="resultCount" class="count">0건</span>
      </div>

      <div id="message" class="message">부산시 교통 데이터를 받아 북구 구간만 필터링합니다.</div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>도로</th>
              <th>속도</th>
              <th>구간</th>
              <th>링크 ID</th>
            </tr>
          </thead>
          <tbody id="trafficTable"></tbody>
        </table>
      </div>
    </section>

    <footer>
      <span>데이터: 부산광역시 교통정보서비스센터</span>
      <span>부산시 링크 교통 데이터 테스트 버전</span>
      <small id="errorDetail" class="error-detail" aria-live="polite"></small>
    </footer>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
